[workspace]
members = [
  "native-core",
  "native-napi",
  "native-screenshot",
  "native-audio",
  "fixtures/native-protocol-addon",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
napi = { version = "=3.12.5", default-features = false, features = ["napi4"] }
napi-derive = "=3.6.8"
napi-build = "=2.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
