appId: com.tagzxia.app.tuff
productName: tuff
executableName: tuff
asar: true
compression: maximum
asarUnpack:
  - '**/node_modules/@libsql/**'
  - '**/node_modules/libsql/**'
  - '**/node_modules/@neon-rs/**'
  - '**/node_modules/detect-libc/**'
  - '**/*.node'
  - '**/*.dylib'
  - '**/*.dll'
  - '**/*.so'
  - '**/tuff-native-translation'
  - '**/tuff-native-update'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/ffmpeg-static/**'
  - '**/node_modules/ffprobe-static/**'
  - '**/node_modules/@prebuilt-binary/fd-*/bin/**'
directories:
  app: .
  buildResources: build
  output: dist
files:
  - out/**
  # LGPL delivery for @talex-touch/pi-desktop-reuse ships as a resource (see extraResources).
  - '!out/legal/**'
  - resources/**
  - '!resources/licenses/**'
  - package.json
  - '!resources/bundled-plugins/**'
  - node_modules/**
  - '!.DS_Store'
  - '!.vscode/**'
  - '!src/**'
  - '!tests/**'
  - '!docs/**'
  - '!examples/**'
  - '!shots/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!**/.eslintcache'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/**'
  - '!build/**'
  - '!**/*.map'
  - '!patches/**'
  # Exclude Rust/Cargo build cache from @talex-touch/tuff-native (~498MB of .rlib/.rmeta intermediates).
  # Runtime only loads build/Release/*.node (native-loader.js); native-{screenshot,audio}/target/ is build-only output.
  - '!**/native-screenshot/target/**'
  - '!**/native-audio/target/**'
  - '!**/tuff-native/target/**'
  - '!**/*.rlib'
  - '!**/*.rmeta'
  # Keep js-tiktoken ESM runtime files: @langchain/core imports js-tiktoken/lite via ESM,
  # which resolves to dist/lite.js from the package exports map in packaged builds.
extraFiles: []
extraResources:
  # Tuff's pi tool forwarder, loaded per spawn via `-e` (see pi-cli-provider);
  # never installed into the user's own pi setup.
  - from: ../../packages/pi-extension-tuff/index.ts
    to: pi-extension-tuff/index.ts
  - from: resources/icon.png
    to: resources/icon.png
  - from: resources/TrayIconTemplate.png
    to: resources/TrayIconTemplate.png
  - from: resources/TrayIconTemplate@2x.png
    to: resources/TrayIconTemplate@2x.png
  - from: resources/tray_icon.png
    to: resources/tray_icon.png
  - from: resources/tray_icon_16x16.png
    to: resources/tray_icon_16x16.png
  - from: resources/tray_icon_22x22.png
    to: resources/tray_icon_22x22.png
  - from: resources/keys/release-signing-public.pem
    to: resources/keys/release-signing-public.pem
  - from: resources/scripts/macos-prepare-update.sh
    to: resources/scripts/macos-prepare-update.sh
  - from: resources/scripts/macos-apply-update.sh
    to: resources/scripts/macos-apply-update.sh
  - from: resources/scripts/macos-restore-update.sh
    to: resources/scripts/macos-restore-update.sh
  - from: resources/scripts/linux-apply-update.sh
    to: resources/scripts/linux-apply-update.sh
  - from: resources/scripts/update-handoff-helper.cjs
    to: resources/scripts/update-handoff-helper.cjs
  - from: resources/bundled-plugins
    to: bundled-plugins
    filter:
      - '**/*'
  - from: resources/licenses/fd-LICENSE-MIT.txt
    to: licenses/fd-LICENSE-MIT.txt
  - from: resources/licenses/fd-LICENSE-APACHE.txt
    to: licenses/fd-LICENSE-APACHE.txt
  # LGPL 4(d)(0) delivery produced by the electron-vite build (scripts/legal/pi-desktop-reuse-legal.cjs);
  # beforePack refuses to pack when it is missing or stale, afterPack checks the packaged copy.
  - from: out/legal/pi-desktop-reuse
    to: legal/pi-desktop-reuse
    filter:
      - '**/*'
      - '!.tuff-legal-owned'

win:
  target:
    - target: nsis
      arch:
        - x64
  verifyUpdateCodeSignature: false
  requestedExecutionLevel: asInvoker
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  warningsAsErrors: false
  runAfterFinish: true
  createStartMenuShortcut: true
  menuCategory: false
  differentialPackage: false
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The required resources copy is explicit; osx-sign also discovers any unpacked Mach-O copy.
  binaries:
    - Contents/Resources/node_modules/@talex-touch/tuff-native/build/Release/tuff-native-update
  extendInfo:
    LSUIElement: true
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSDesktopFolderUsageDescription: Application requests access to the user's Desktop folder.
  # The release workflow already refuses to build a macOS release without Developer ID and an
  # App Store Connect key (build-and-release.yml, "macOS signing required"), and writes the .p8
  # for notarytool itself. This was the one place still saying no (#786).
  notarize: true
  gatekeeperAssess: false
  # `dir` produces an unpackaged .app: nothing a user can download and install, and nothing the
  # updater can consume (#594). dmg is what people install from; zip is what electron-updater
  # reads on macOS, so dropping it would ship an app that cannot update itself.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  category: public.app-category.productivity
  # Deliberately left off. The release job hard-errors when credentials are missing, so the gate
  # exists where it matters; turning this on would only break local builds for developers who
  # have no certificate and are not producing releases.
  forceCodeSigning: false
  # node-pty ships Windows-only conpty DLLs for every platform. They are data on macOS,
  # not Mach-O code, and codesign cannot attach an Apple timestamp to them.
  signIgnore:
    - '(^|/)node_modules/node-pty/third_party/conpty/'
  hardenedRuntime: true
  # Both parts are load-bearing. ${arch}: without it the arm64 and x64 builds resolve to the same
  # filename and one silently overwrites the other. `macos`: inferCoreArtifactIdentity recognises
  # a mac artifact by `macos`/`darwin` in the name or a `.dmg`/`.app.zip` suffix, so a plain
  # `-arm64.zip` counted as a core package it could not identify, and manifest validation rejects
  # an artifact whose platform cannot be inferred (#311).
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
dmg:
linux:
  target:
    - AppImage
    - deb
  maintainer: tagzxia.com
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
  category: Utility
  synopsis: A powerful productivity launcher and automation tool
deb:
  artifactName: ${productName}-${version}.${ext}
  category: Utility
  synopsis: A powerful productivity launcher and automation tool
npmRebuild: false
forceCodeSigning: false
# Fix for pnpm workspace dependency resolution issues with electron-builder
# Skip automatic dependency detection and use only what's in out/package.json
publish:
  provider: github
  owner: talex-touch
  repo: tuff
beforePack: scripts/build-target/before-pack.js
afterPack: scripts/build-target/after-pack.js
