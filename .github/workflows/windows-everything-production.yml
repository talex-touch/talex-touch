name: Windows Everything Production Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-everything-production.yml"
      - "apps/core-app/package.json"
      - "apps/core-app/electron-builder.yml"
      - "apps/core-app/scripts/build-target.js"
      - "apps/core-app/scripts/build-target/**"
      - "apps/core-app/scripts/everything-diagnostic-verify.ts"
      - "apps/core-app/scripts/everything-corebox-ui-verify.ts"
      - "apps/core-app/scripts/coreapp-packaged-corebox-everything-probe.ts"
      - "apps/core-app/scripts/windows-acceptance-*.ts"
      - "apps/core-app/src/main/modules/box-tool/addon/files/everything-*.ts"
      - "apps/core-app/src/main/modules/platform/everything-*.ts"
      - "apps/core-app/src/main/modules/platform/windows-acceptance-*.ts"
      - "apps/core-app/src/renderer/src/components/settings/EverythingDiagnosticPanel.vue"
      - "apps/core-app/src/renderer/src/views/base/settings/SettingEverything.vue"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/tuff-native/**"
      - "scripts/ci/*windows-everything.ps1"

permissions:
  contents: read

concurrency:
  group: windows-everything-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-everything:
    name: SDK, CLI, unavailable, and packaged native
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python native-build dependencies
        run: python -m pip install setuptools

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native evidence and resource contracts
        working-directory: packages/tuff-native
        run: node --test scripts/everything-selfcheck.test.js everything-resources.test.js

      - name: Rebuild native addon for Node.js
        working-directory: packages/tuff-native
        run: pnpm run rebuild

      - name: Install verified Everything runtime
        shell: pwsh
        run: ./scripts/ci/setup-windows-everything.ps1

      - name: Collect real SDK, CLI, and unavailable evidence
        shell: pwsh
        run: ./scripts/ci/collect-windows-everything-evidence.ps1 -SampleCount 200

      - name: Run focused Everything production tests
        working-directory: apps/core-app
        run: >-
          pnpm exec vitest run
          scripts/build-target/after-pack.test.ts
          scripts/build-target/runtime-modules.test.ts
          src/main/modules/box-tool/addon/files/everything-provider.test.ts
          src/main/modules/box-tool/search-engine/everything-indexed-source.test.ts
          src/main/modules/platform/everything-diagnostic-verifier.test.ts
          src/main/modules/platform/windows-acceptance-evidence-verifier.test.ts
          src/main/modules/platform/windows-acceptance-manifest-verifier.test.ts
          src/main/modules/platform/windows-acceptance-verify-script.test.ts
          src/main/modules/platform/windows-capability-evidence.test.ts
          src/renderer/src/views/base/settings/everything-diagnostic-evidence.test.ts
          src/renderer/src/views/base/settings/setting-everything-state.test.ts

      # This workflow packages a Windows app with CI=true, and build-target.js treats its required
      # addon list as fatal there — audio is on that list now, and `pnpm install` never builds it
      # (binding.gyp declares only ocr and everything; audio and screenshot are Cargo artifacts).
      # Without this step the snapshot below fails; with it, the same two addons the release
      # pipeline builds are the ones under test.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/tuff-native

      - name: Build native addons and verify they load
        run: >-
          pnpm -C packages/tuff-native run build:audio &&
          pnpm -C packages/tuff-native run verify:audio-production &&
          pnpm -C packages/tuff-native run build:screenshot &&
          pnpm -C packages/tuff-native run verify:screenshot-production

      - name: Build Chrome Native Messaging host
        run: node packages/tuff-native/scripts/build-browser-bridge.js

      - name: Build unpacked Windows snapshot
        env:
          BUILD_PUBLISH: never
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm build:app --target=win --type=snapshot

      - name: Record packaged native evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'apps/core-app/dist'
          $wrapper = Get-ChildItem -Path $dist -Filter 'everything.js' -Recurse |
            Where-Object { $_.FullName -match 'node_modules[\\/]@talex-touch[\\/]tuff-native' } |
            Select-Object -First 1
          $resourceManifest = Get-ChildItem -Path $dist -Filter 'everything-resources.js' -Recurse |
            Where-Object { $_.FullName -match 'node_modules[\\/]@talex-touch[\\/]tuff-native' } |
            Select-Object -First 1
          $native = Get-ChildItem -Path $dist -Filter 'tuff_native_everything.node' -Recurse |
            Where-Object { $_.FullName -match 'node_modules[\\/]@talex-touch[\\/]tuff-native' } |
            Select-Object -First 1
          if (-not $wrapper) { throw 'Packaged Everything wrapper is missing.' }
          if (-not $resourceManifest) { throw 'Packaged Everything resource manifest is missing.' }
          if (-not $native) { throw 'Packaged Everything native addon is missing.' }
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'tuff-everything-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          [ordered]@{
            schema = 'windows-everything-packaged-native/v1'
            ok = $true
            wrapper = $wrapper.Name
            resourceManifest = $resourceManifest.Name
            native = $native.Name
            nativeSize = $native.Length
            nativeSha256 = (Get-FileHash -Path $native.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Path (Join-Path $evidenceDirectory 'packaged-native.json') -Encoding UTF8

      # The collector above stops the portable runtime to prove the unavailable state, and the packaged
      # snapshot now exists, so the packaged UI evidence starts here: restart the verified runtime,
      # collect the SDK-backed CoreBox searches, then stop it again for the degraded phase.
      # `setup-windows-everything.ps1` pins `folders=` in Everything.ini to the fixture directory, so
      # the only indexed file is the marker the probe queries.
      - name: Restart verified Everything runtime for packaged UI evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configPath = Join-Path (Split-Path -Parent $env:TUFF_EVERYTHING_EXE) 'Everything.ini'
          $process = Start-Process -FilePath $env:TUFF_EVERYTHING_EXE -ArgumentList @(
            '-config',
            $configPath,
            '-startup'
          ) -PassThru
          Start-Sleep -Seconds 3
          $process.Refresh()
          if ($process.HasExited) {
            throw "Everything client exited during restart with code $($process.ExitCode)."
          }
          $readyPath = Join-Path $env:RUNNER_TEMP 'tuff-everything-evidence/corebox-ui/sdk-ready.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $readyPath) | Out-Null
          $ready = $false
          for ($attempt = 1; $attempt -le 60; $attempt += 1) {
            & node packages/tuff-native/scripts/everything-selfcheck.js --query $env:TUFF_EVERYTHING_MARKER --max 5 --samples 1 --require-results --output $readyPath | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            throw 'Everything SDK did not return the CI marker after restarting the runtime.'
          }

      - name: Probe packaged CoreBox Everything UI with the SDK backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'tuff-everything-evidence/corebox-ui'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          pnpm -C apps/core-app run windows:corebox-everything:probe -- `
            --app-bundle dist/win-unpacked `
            --output-dir "$output" `
            --evidence "$output/corebox-ui.json" `
            --expect-backend sdk-napi `
            --marker $env:TUFF_EVERYTHING_MARKER `
            --sdk-dll-path $env:TALEX_EVERYTHING_DLL_PATH `
            --launch-timeout-ms 180000 `
            --mode-timeout-ms 30000 `
            --compact
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged CoreBox Everything UI probe failed with the SDK backend.'
          }

      - name: Verify packaged CoreBox Everything UI evidence
        working-directory: apps/core-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'tuff-everything-evidence/corebox-ui'
          pnpm run everything:corebox-ui:verify -- `
            --input "$output/corebox-ui.json" `
            --requireModes normal,explicit-file,structured-filter `
            --requireBackend sdk-napi `
            --requireAvailable `
            --requireResultRows `
            --requireMarkerMatches `
            --requireScreenshots `
            --requireEmptyState `
            --requirePlatform win32 `
            --compact
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged CoreBox Everything UI evidence failed strict verification.'
          }

      - name: Stop Everything runtime for the degraded UI phase
        shell: pwsh
        run: |
          if ($env:TUFF_EVERYTHING_EXE -and (Test-Path $env:TUFF_EVERYTHING_EXE)) {
            Start-Process -FilePath $env:TUFF_EVERYTHING_EXE -ArgumentList '-exit' -Wait -ErrorAction SilentlyContinue
          }
          Write-Host 'Everything runtime stopped for the degraded UI phase.'

      - name: Probe packaged CoreBox Everything UI with the backend unavailable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'tuff-everything-evidence/corebox-ui'
          pnpm -C apps/core-app run windows:corebox-everything:probe -- `
            --app-bundle dist/win-unpacked `
            --output-dir "$output" `
            --evidence "$output/corebox-ui-degraded.json" `
            --expect-backend unavailable `
            --marker $env:TUFF_EVERYTHING_MARKER `
            --sdk-dll-path "$output/missing-everything64.dll" `
            --launch-timeout-ms 180000 `
            --mode-timeout-ms 30000 `
            --compact
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged CoreBox Everything UI probe did not observe the unavailable backend.'
          }

      - name: Verify packaged CoreBox degraded UI evidence
        working-directory: apps/core-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'tuff-everything-evidence/corebox-ui'
          pnpm run everything:corebox-ui:verify -- `
            --input "$output/corebox-ui-degraded.json" `
            --requireModes normal,explicit-file,structured-filter `
            --requireBackend unavailable `
            --requireDegraded `
            --requireScreenshots `
            --requirePlatform win32 `
            --compact
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged CoreBox degraded UI evidence failed strict verification.'
          }

      - name: Upload Windows Everything evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-everything-production-evidence
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          path: |
            ${{ runner.temp }}/tuff-everything-runtime/setup-evidence.json
            ${{ runner.temp }}/tuff-everything-evidence/*.json
            ${{ runner.temp }}/tuff-everything-evidence/corebox-ui/*.json
            ${{ runner.temp }}/tuff-everything-evidence/corebox-ui/*.png

      - name: Clean up Everything service
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:TUFF_EVERYTHING_EXE -and (Test-Path $env:TUFF_EVERYTHING_EXE)) {
            Start-Process -FilePath $env:TUFF_EVERYTHING_EXE -ArgumentList '-exit' -Wait -ErrorAction SilentlyContinue
            Start-Process -FilePath $env:TUFF_EVERYTHING_EXE -ArgumentList '-uninstall-service' -Wait -ErrorAction SilentlyContinue
          }
          Write-Host 'Everything cleanup finished.'
