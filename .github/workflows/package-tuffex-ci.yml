name: Tuffex Package CI

on:
  pull_request:
    paths:
      - "packages/tuffex/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/package-tuffex-ci.yml"
      - ".github/workflows/package-ci.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "packages/tuffex/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/package-tuffex-ci.yml"
      - ".github/workflows/package-ci.yml"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/package-ci.yml
    with:
      package-name: tuffex
      package-path: packages/tuffex
      run-typecheck: true
      run-lint: true
      run-test: true
      run-build: true
      build-command: pnpm build
      # Every audit in the command below gates this job. The comment that used to sit here said only two
      # of them ran because audit:types was "broken by construction" and audit:size was
      # over budget -- but the command below has run all four for some time, and as of
      # 2026-08-20 audit:types passes and audit:size is green again (border-beam's
      # measured outlier is recorded as a per-file exception in the audit script).
      post-build-command: pnpm audit:exports && pnpm audit:exports:self-test && pnpm audit:readme && pnpm audit:readme:self-test && pnpm audit:types && pnpm audit:types:self-test && pnpm audit:size && pnpm audit:size:self-test && pnpm audit:changelog && pnpm audit:changelog:self-test && pnpm audit:colors && pnpm audit:colors:self-test
