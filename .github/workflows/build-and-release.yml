name: Build and Release

on:
  # 手动触发（可选：同步现有 tag，或从失败 run 恢复发布）
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: beta
        type: choice
        options:
          - beta
          - snapshot
          - release
      sync_tag:
        description: Optional existing tag to sync or recover (e.g. v2.4.7)
        required: false
        type: string
      recover_run_id:
        description: Optional failed release run ID whose build artifacts should be reused
        required: false
        type: string

      rollback_compatible:
        description: Enable normal-quit recovery only with verified downgrade evidence
        required: false
        default: false
        type: boolean
      rollback_evidence:
        description: Repository-relative canonical downgrade evidence JSON when rollback compatibility is enabled
        required: false
        type: string
      rollback_evidence_signature:
        description: Repository-relative detached signature for rollback_evidence
        required: false
        type: string
  # 标签触发（使用 bumpp 打好的标签自动触发）
  push:
    tags:
      - v*.*.*

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-quality:
    name: Release Quality (same SHA)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release-sha.outputs.sha }}

    steps:
      - name: Check out release target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_tag != '' && github.event.inputs.sync_tag || github.sha }}

      - name: Resolve release commit
        id: release-sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release quality gate
        run: pnpm quality:release

  build-and-release:
    name: Build and Release Tuff App
    needs: release-quality
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    if: >
      needs.release-quality.result == 'success'
      && (github.event_name != 'workflow_dispatch' || github.event.inputs.sync_tag == '')
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../electron-builder-cache
      BUILD_PUBLISH: never

    strategy:
      fail-fast: false
      matrix:
        # `os` is the logical platform key, not a runner label. Every `matrix.os == ...`
        # condition below compares against it -- including the macOS signing secrets -- and the
        # uploaded artifact is named `${{ matrix.os }}-<channel>`, which the collect job looks
        # up by that exact string. Renaming `os` therefore disables code signing silently.
        # `image` is the runner that actually executes, pinned so a tag rebuild cannot land on
        # a different toolchain. Bump `image` deliberately; leave `os` alone.
        include:
          - os: windows-2022
            image: windows-2022
          - os: macos-latest
            image: macos-26
          - os: ubuntu-latest
            image: ubuntu-24.04

    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-quality.outputs.sha }}

      - name: Setup Python (for native dependencies)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install setuptools

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # A tag and the manifest are two different sources for "which release is this", and
      # nothing reconciled them (#550). Runs before the platform builds so a mismatch costs
      # seconds instead of three builds, and skips cleanly on a branch ref, which is what a
      # workflow_dispatch build without a sync_tag has.
      - name: Verify the tag matches the built version
        run: node scripts/check-release-tag-version.mjs --tag "${GITHUB_REF_NAME}"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Everything evidence and resource contracts
        if: matrix.os == 'windows-2022'
        working-directory: packages/tuff-native
        run: node --test scripts/everything-selfcheck.test.js everything-resources.test.js

      - name: Rebuild Everything native addon for Node.js
        if: matrix.os == 'windows-2022'
        working-directory: packages/tuff-native
        run: pnpm run rebuild

      - name: Install verified Everything runtime
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: ./scripts/ci/setup-windows-everything.ps1

      - name: Collect real Everything SDK, CLI, and unavailable evidence
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: ./scripts/ci/collect-windows-everything-evidence.ps1 -SampleCount 200

      - name: Upload Windows Everything runtime evidence
        if: ${{ always() && matrix.os == 'windows-2022' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-everything-release-evidence
          if-no-files-found: error
          retention-days: 30
          overwrite: true
          path: |
            ${{ runner.temp }}/tuff-everything-runtime/setup-evidence.json
            ${{ runner.temp }}/tuff-everything-evidence/*.json

      - name: Clean up Everything service
        if: ${{ always() && matrix.os == 'windows-2022' }}
        shell: pwsh
        run: |
          if ($env:TUFF_EVERYTHING_EXE -and (Test-Path $env:TUFF_EVERYTHING_EXE)) {
            Start-Process -FilePath $env:TUFF_EVERYTHING_EXE -ArgumentList '-exit' -Wait -ErrorAction SilentlyContinue
            Start-Process -FilePath $env:TUFF_EVERYTHING_EXE -ArgumentList '-uninstall-service' -Wait -ErrorAction SilentlyContinue
          }
          Write-Host 'Everything cleanup finished.'

      - name: Fix Binary Permissions
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "Fixing binary permissions for Linux build..."
          # 修复所有可能的二进制文件权限
          find . -name "app-builder" -type f -exec chmod +x {} \; 2>/dev/null || true
          find . -name "app-builder-bin" -type f -exec chmod +x {} \; 2>/dev/null || true
          find . -name "electron-builder" -type f -exec chmod +x {} \; 2>/dev/null || true
          echo "Binary permissions fixed"

      - name: Determine Release Type
        id: release-type
        shell: bash
        run: |
          {
            if [ "$EVENT_NAME" = "push" ]; then
              # 标签触发：从标签提取版本信息
              REF_NAME_LOWER=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]')
              if [[ "$REF_NAME_LOWER" == *"beta"* ]]; then
                echo "type=beta"
              elif [[ "$REF_NAME_LOWER" == *"snapshot"* ]]; then
                echo "type=snapshot"
              else
                echo "type=release"
              fi
              echo "tag=$REF_NAME"
              echo "version=${REF_NAME#v}"
            else
              # 手动触发：只设置构建类型，不处理版本和标签
              echo "type=$RELEASE_TYPE"
              echo "tag="
              echo "version="
            fi
          } >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}

      # Removed: Update Version Numbers step - no longer needed
      # Version numbers should be updated manually before creating tags

      - name: Prepare Build Environment
        shell: bash
        run: |
          # 确保输出目录存在
          mkdir -p apps/core-app/dist
          mkdir -p apps/core-app/dist/__appImage-x64
          mkdir -p apps/core-app/dist/__deb-x64
          mkdir -p apps/core-app/dist/@talex-touch
          mkdir -p "${GITHUB_WORKSPACE}/.cache/electron"
          mkdir -p "${GITHUB_WORKSPACE}/.cache/electron-builder"
          # 设置正确的权限
          chmod -R 755 apps/core-app/dist
          echo "Build directories prepared"

      - name: Set Build Environment Variables
        shell: bash
        run: |
          # GitHub Actions 自动提供 GITHUB_SHA
          echo "GITHUB_SHA is set: ${GITHUB_SHA}"
          echo "Setting Electron download/cache mirrors..."

      - name: Clean Previous Build Artifacts
        shell: bash
        run: |
          echo "Cleaning previous build artifacts..."
          # 清理可能存在的构建产物
          rm -rf apps/core-app/dist/__*
          rm -rf apps/core-app/dist/@talex-touch
          rm -rf apps/core-app/out
          # 清理 electron 下载/构建缓存
          rm -rf "${GITHUB_WORKSPACE}/.cache/electron"
          rm -rf "${GITHUB_WORKSPACE}/.cache/electron-builder"
          # 清理 node_modules 中的缓存
          rm -rf node_modules/.cache
          rm -rf apps/core-app/node_modules/.cache
          # 清理 electron-builder 和 Wine 缓存
          rm -rf apps/core-app/.electron-builder-cache
          rm -rf ~/.cache/electron-builder
          rm -rf ~/.electron-builder-cache
          echo "Build artifacts and caches cleaned"

      - name: Clean Windows Build Artifacts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Cleaning previous Windows build artifacts..."
          $distPath = "apps/core-app/dist"
          if (Test-Path $distPath) {
            # 删除可能存在的安装程序文件
            Get-ChildItem -Path $distPath -Recurse -Include "*.exe", "*.msi", "*.7z" | Remove-Item -Force -ErrorAction SilentlyContinue
            # 删除 win-unpacked 目录
            $unpackedPath = Join-Path $distPath "win-unpacked"
            if (Test-Path $unpackedPath) {
              Remove-Item -Path $unpackedPath -Recurse -Force -ErrorAction SilentlyContinue
            }
            # 删除 @talex-touch 输出目录
            $outputPath = Join-Path $distPath "@talex-touch"
            if (Test-Path $outputPath) {
              Remove-Item -Path $outputPath -Recurse -Force -ErrorAction SilentlyContinue
            }
            # 删除 NSIS 临时文件
            Get-ChildItem -Path $distPath -Recurse -Include "__uninstaller-*" | Remove-Item -Force -ErrorAction SilentlyContinue
            # 删除缓存目录
            $cachePath = Join-Path $distPath ".electron-builder-cache"
            if (Test-Path $cachePath) {
              Remove-Item -Path $cachePath -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Windows build artifacts cleaned"

      - name: Check Windows Disk Space and Write Permission
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Checking disk space and write permission..."
          Get-PSDrive -PSProvider 'FileSystem' | Select-Object Name, Free, Used, @{Name='FreeGB';Expression={[math]::Round($_.Free/1GB,2)}}
          $distPath = "apps/core-app/dist"
          if (-not (Test-Path $distPath)) { New-Item -ItemType Directory -Force -Path $distPath | Out-Null }
          $testFile = Join-Path $distPath "test-write.tmp"
          try {
            Set-Content -Path $testFile -Value "test" -Encoding ASCII
            Remove-Item -Path $testFile -Force
            Write-Host "Write permission verified"
          } catch {
            Write-Error "Write permission check failed: $($_.Exception.Message)"
            exit 1
          }

      - name: Prepare Windows Build Environment
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Preparing Windows build environment..."
          $distPath = "apps/core-app/dist"
          $outputPath = Join-Path $distPath "@talex-touch"

          # 确保输出目录存在
          if (-not (Test-Path $outputPath)) {
            New-Item -ItemType Directory -Force -Path $outputPath | Out-Null
            Write-Host "Created output directory: $outputPath"
          }

          # 设置目录权限（Windows 上确保可写）
          try {
            $testFile = Join-Path $outputPath "permission-test.tmp"
            Set-Content -Path $testFile -Value "test" -Encoding ASCII
            Remove-Item -Path $testFile -Force
            Write-Host "Output directory permissions verified"
          } catch {
            Write-Error "Output directory permission test failed: $($_.Exception.Message)"
            exit 1
          }

          Write-Host "Windows build environment prepared"

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "Installing Linux build dependencies..."

          # 更新包列表
          sudo apt-get update -y

          # 安装基础构建工具和 uiohook/libuiohook 在 X11 环境下 rebuild 所需头文件
          sudo apt-get install -y \
            squashfs-tools \
            fakeroot \
            dpkg-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxkbfile-dev \
            libxi-dev \
            libxext-dev

          # 两个 Cargo addon 的 Linux 构建依赖，与 native-protocol.yml 用同一份清单：
          # 音频走 ALSA / PipeWire / D-Bus，截图走 xcap（xcb-randr、xdo、EGL、GBM、Wayland）。
          sudo apt-get install -y \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

          # 跳过 snapcraft 安装，只构建 AppImage 和 Debian 包
          echo "Skipping snapcraft installation to avoid snapd issues"
          echo "Will build AppImage and Debian packages only"

          echo "Linux build dependencies installed successfully"

      - name: Prepare Linux Build Environment
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "Preparing Linux build environment..."

          # 确保所有必要的目录存在（只创建需要的目录）
          mkdir -p apps/core-app/dist/__appImage-x64
          mkdir -p apps/core-app/dist/__deb-x64
          mkdir -p apps/core-app/dist/@talex-touch

          # 设置正确的权限
          chmod -R 755 apps/core-app/dist

          # 修复 app-builder 二进制文件权限
          echo "Fixing app-builder permissions..."
          find node_modules -name "app-builder" -type f -exec chmod +x {} \; 2>/dev/null || true
          find node_modules -name "app-builder-bin" -type f -exec chmod +x {} \; 2>/dev/null || true

          # 检查磁盘空间
          echo "Disk space check:"
          df -h

          echo "Linux build environment prepared successfully (AppImage + Debian only)"

      - name: Install macOS Dependencies
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # macOS 通常不需要额外依赖，但可以检查 Xcode Command Line Tools
          xcode-select --install || echo "Xcode Command Line Tools already installed"
          echo "macOS build environment ready"

      - name: Resolve macOS Release Signing Mode
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          IFS=$'\t' read -r signing_mode notarization_method < <(
            node scripts/resolve-macos-release-signing-mode.mjs --format shell
          )
          echo "TUFF_MAC_NATIVE_SIGNING_MODE=${signing_mode}" >> "${GITHUB_ENV}"

          if [ "${signing_mode}" != "developer-id" ]; then
            echo "::error title=macOS signing required::Developer ID signing and notarization credentials are required for every macOS release build."
            exit 1
          fi
          if [ "${notarization_method}" != "api-key" ]; then
            echo "::error title=App Store Connect API key required::macOS release notarization must use the configured App Store Connect API key."
            exit 1
          fi

          echo "TUFF_OFFICIAL_RELEASE_BUILD=true" >> "${GITHUB_ENV}"
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          umask 077
          if [[ "${APPLE_API_KEY_CONTENT}" == -----BEGIN* ]]; then
            printf '%s' "${APPLE_API_KEY_CONTENT}" > "${key_path}"
          else
            printf '%s' "${APPLE_API_KEY_CONTENT}" | openssl base64 -d -A > "${key_path}"
          fi
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"
          echo "Developer ID signing and App Store Connect API key notarization enabled."

      # `pnpm install` does not build these. The package's install hook is
      # `node-gyp configure build`, and binding.gyp declares only the ocr and everything targets;
      # the audio and screenshot addons are Rust artifacts. Until now the only things that built
      # them were the dev wrapper (`apps/core-app/scripts/dev-electron-wrapper.mjs`, developer
      # machines only) and native-protocol.yml, which is a contract-test workflow and produces no
      # release artifact. So the packaged app shipped without them: 2.4.14-beta.47 had no
      # tuff_native_audio.node and every voice entry point in that build was dead (#322), and the
      # screenshot addon was absent the same way (#321).
      #
      # Both verifiers pass on a runner with no microphone and no display server — they
      # distinguish the reason the *native module* reports (no-input-device,
      # display-server-unavailable) from the reason the JS wrapper reports when the binding is
      # missing, and only the latter fails. That is what makes this step safe in a headless CI job.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch

      - name: Prepare universal Chrome bridge targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/tuff-native

      - name: Build native addons and verify they load
        run: >-
          pnpm -C packages/tuff-native run build:audio &&
          pnpm -C packages/tuff-native run verify:audio-production &&
          pnpm -C packages/tuff-native run build:screenshot &&
          pnpm -C packages/tuff-native run verify:screenshot-production

      - name: Build Chrome Native Messaging host
        run: node packages/tuff-native/scripts/build-browser-bridge.js ${{ matrix.os == 'macos-latest' && '--universal' || '' }}

      - name: Build macOS on-device translation helper
        if: matrix.os == 'macos-latest'
        run: node packages/tuff-native/scripts/build-translation.js --universal

      - name: Build macOS atomic update helper
        if: matrix.os == 'macos-latest'
        run: node packages/tuff-native/scripts/build-update.js --universal

      - name: Build Tuff App
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          TUFF_RELEASE_ATTESTATION_REQUIRED: "true"
          RELEASE_TYPE: ${{ steps.release-type.outputs.type }}
          RUNNER_OS: ${{ runner.os }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          set -e  # Exit immediately if a command exits with a non-zero status

          echo "Starting build process for $RUNNER_OS..."
          echo "Current directory: $(pwd)"
          echo "RELEASE_TYPE: $RELEASE_TYPE"
          echo "RUNNER_OS: $RUNNER_OS"
          echo "GITHUB_SHA: $GITHUB_SHA"

          # 检查构建环境
          echo "Checking build environment..."
          echo "Node version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"

          # 检查 dist 目录
          echo "Checking dist directory before build:"
          if [ -d "apps/core-app/dist" ]; then
            echo "Dist directory exists, cleaning..."
            rm -rf apps/core-app/dist/* || echo "Cannot clean dist (may be empty)"
          else
            echo "Dist directory does not exist (will be created)"
          fi

          # 执行构建
          BUILD_FAILED=false
          set +e  # Temporarily disable exit on error to capture build failure
          if [ "$RELEASE_TYPE" = "beta" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "Building Windows beta..."
              echo "Running: pnpm build:app --target=win --type=beta"
              pnpm build:app --target=win --type=beta || {
                BUILD_FAILED=true
                echo "ERROR: Windows beta build failed with exit code $?"
              }
            elif [ "$RUNNER_OS" = "macOS" ]; then
              echo "Building macOS beta..."
              echo "Using NODE_OPTIONS=--max-old-space-size=6144 for macOS beta build"
              NODE_OPTIONS="--max-old-space-size=6144" SKIP_INSTALL_APP_DEPS=true pnpm build:app --target=mac --type=beta || {
                BUILD_FAILED=true
                echo "ERROR: macOS beta build failed with exit code $?"
              }
            else
              echo "Building Linux beta..."
              pnpm build:app --target=linux --type=beta || {
                BUILD_FAILED=true
                echo "ERROR: Linux beta build failed with exit code $?"
              }
            fi
          elif [ "$RELEASE_TYPE" = "snapshot" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "Building Windows snapshot..."
              echo "Running: pnpm build:app --target=win --type=snapshot"
              pnpm build:app --target=win --type=snapshot || {
                BUILD_FAILED=true
                echo "ERROR: Windows snapshot build failed with exit code $?"
              }
            elif [ "$RUNNER_OS" = "macOS" ]; then
              echo "Building macOS snapshot..."
              echo "Using NODE_OPTIONS=--max-old-space-size=6144 for macOS snapshot build"
              NODE_OPTIONS="--max-old-space-size=6144" SKIP_INSTALL_APP_DEPS=true pnpm build:app --target=mac --type=snapshot || {
                BUILD_FAILED=true
                echo "ERROR: macOS snapshot build failed with exit code $?"
              }
            else
              echo "Building Linux snapshot..."
              pnpm build:app --target=linux --type=snapshot || {
                BUILD_FAILED=true
                echo "ERROR: Linux snapshot build failed with exit code $?"
              }
            fi
          else
            echo "Building release version..."
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "Building Windows release..."
              pnpm build:app --target=win --type=release || {
                BUILD_FAILED=true
                echo "ERROR: Windows release build failed with exit code $?"
              }
            elif [ "$RUNNER_OS" = "macOS" ]; then
              echo "Building macOS release..."
              echo "Using NODE_OPTIONS=--max-old-space-size=6144 for macOS release build"
              NODE_OPTIONS="--max-old-space-size=6144" SKIP_INSTALL_APP_DEPS=true pnpm build:app --target=mac --type=release || {
                BUILD_FAILED=true
                echo "ERROR: macOS release build failed with exit code $?"
              }
            else
              echo "Building Linux release..."
              pnpm build:app --target=linux --type=release || {
                BUILD_FAILED=true
                echo "ERROR: Linux release build failed with exit code $?"
              }
            fi
          fi
          set -e  # Re-enable exit on error

          # 验证构建输出
          echo ""
          echo "Verifying build output..."

          if [ "$BUILD_FAILED" = "true" ]; then
            echo "ERROR: Build step reported failure!"
            if [ -d "apps/core-app/dist" ]; then
              echo "Checking for partial build artifacts..."
              find apps/core-app/dist -type f 2>/dev/null | head -20 || echo "Cannot list files"
            fi
            exit 1
          fi

          if [ ! -d "apps/core-app/dist" ]; then
            echo "ERROR: Dist directory was not created!"
            echo "Checking if build directory exists:"
            ls -la apps/core-app/ || echo "Cannot list core-app directory"
            exit 1
          fi

          echo "✓ Dist directory exists"

          # 检查文件数量
          FILE_COUNT=$(find apps/core-app/dist -type f 2>/dev/null | wc -l || echo "0")
          echo "Total files in dist: $FILE_COUNT"

          if [ "$FILE_COUNT" = "0" ]; then
            echo "ERROR: Dist directory exists but is empty!"
            echo "Build may have failed silently. Checking dist structure:"
            ls -la apps/core-app/dist/ || echo "Cannot list dist contents"
            echo ""
            echo "Checking for any files in subdirectories:"
            find apps/core-app/dist -type f -o -type d 2>/dev/null | head -20 || echo "No files found"
            exit 1
          fi

          echo "Dist directory contents:"
          ls -la apps/core-app/dist/ || echo "Cannot list dist contents"

          echo ""
          echo "Searching for build artifacts:"
          ARTIFACTS_FOUND=false

          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE_COUNT=$(find apps/core-app/dist -name "*.exe" -type f 2>/dev/null | wc -l || echo "0")
            echo "Found $EXE_COUNT .exe file(s)"
            if [ "$EXE_COUNT" -gt 0 ]; then
              find apps/core-app/dist -name "*.exe" -type f 2>/dev/null
              ARTIFACTS_FOUND=true
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            DMG_COUNT=$(find apps/core-app/dist -name "*.dmg" -type f 2>/dev/null | wc -l || echo "0")
            ZIP_COUNT=$(find apps/core-app/dist -name "*.zip" -type f 2>/dev/null | wc -l || echo "0")
            # A bare .app is reported but does not count. The release step collects with
            # `find artifacts -type f` over a fixed extension list, and nothing in this workflow
            # repackages a .app -- upload-artifact compresses for transport and download-artifact
            # extracts it straight back to a directory. Counting it set ARTIFACTS_FOUND=true while
            # macOS contributed zero assets (#1608); the mirror of the SNAP_COUNT case in #801,
            # where a counter that could never be non-zero read as coverage.
            APP_DIR_COUNT=$(find apps/core-app/dist -name "*.app" -type d -path "*/mac-*/*" 2>/dev/null | wc -l || echo "0")
            echo "Found $DMG_COUNT .dmg file(s) and $ZIP_COUNT .zip file(s); $APP_DIR_COUNT unpackaged .app directory/directories (not uploadable)"
            if [ "$DMG_COUNT" -gt 0 ]; then
              find apps/core-app/dist -name "*.dmg" -type f 2>/dev/null
              ARTIFACTS_FOUND=true
            fi
            if [ "$ZIP_COUNT" -gt 0 ]; then
              find apps/core-app/dist -name "*.zip" -type f 2>/dev/null
              ARTIFACTS_FOUND=true
            fi
            if [ "$ARTIFACTS_FOUND" != "true" ] && [ "$APP_DIR_COUNT" -gt 0 ]; then
              echo "The macOS target produced only an unpackaged .app. Nothing here can become a"
              echo "release asset -- see #594 for the target format, which is independent of signing."
              find apps/core-app/dist -name "*.app" -type d -path "*/mac-*/*" 2>/dev/null
            fi
          else
            APPIMAGE_COUNT=$(find apps/core-app/dist -name "*.AppImage" -type f 2>/dev/null | wc -l || echo "0")
            DEB_COUNT=$(find apps/core-app/dist -name "*.deb" -type f 2>/dev/null | wc -l || echo "0")
            # No .snap: the Linux targets are AppImage and deb, and snapcraft is deliberately not
            # installed a few steps above. A counter that cannot be non-zero read as coverage (#801).
            echo "Found $APPIMAGE_COUNT .AppImage, $DEB_COUNT .deb file(s)"
            if [ "$APPIMAGE_COUNT" -gt 0 ] || [ "$DEB_COUNT" -gt 0 ]; then
              find apps/core-app/dist \( -name "*.AppImage" -o -name "*.deb" \) -type f 2>/dev/null
              ARTIFACTS_FOUND=true
            fi
          fi

          if [ "$ARTIFACTS_FOUND" = "false" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "ERROR: No .exe files found in dist directory!"
            elif [ "$RUNNER_OS" = "macOS" ]; then
              echo "ERROR: No .dmg files, .app directories, or .zip files found in dist directory!"
            else
              echo "ERROR: No Linux artifacts (.AppImage or .deb) found in dist directory!"
            fi
            echo "This may indicate the electron-builder step failed silently."
            echo "Check the electron-builder output above for errors."
            exit 1
          fi

          echo ""
          echo "✓ Build completed successfully"

      # #213 has been open since 2025-11-14 on "Ubuntu 24.04 启动不了". The step above counts
      # .AppImage and .deb files and asserts the count is non-zero -- but a file that exists and a
      # file that runs are different claims, and only the first was ever checked. Nothing in this
      # repository has ever started the Linux artifact, which is why the thread spent nine months
      # asking the reporter for logs nobody here could produce.
      #
      # The runner is already ubuntu-24.04, pinned in the matrix: the reproduction environment was
      # here the whole time. This launches the AppImage under a virtual X server and reads why it
      # stopped, if it stopped. AppImage rather than .deb on purpose -- electron-builder ships a
      # .deb with an AppArmor profile that exempts it from the 24.04 userns restriction, and an
      # AppImage cannot carry one, so the AppImage is the artifact the report is most likely about.
      - name: "Smoke: launch the packaged Linux app"
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # -e is on so a failed apt-get stops here. Without it the step would carry on and the
          # launch would exit for a provisioning reason -- a missing xvfb-run gives an exit code
          # with no output, which classifies as unknown-exit and is reported as a *product*
          # failure. Misattributing CI breakage to the app is the one outcome this check must not
          # produce. Found by CodeRabbit on #1736.
          set -euo pipefail
          sudo apt-get update -qq
          # t64 names are the 24.04 spelling; the fallback covers an older image if the runner moves.
          sudo apt-get install -y -qq xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 || sudo apt-get install -y -qq xvfb libgbm1 libnss3 libasound2 libgtk-3-0
          command -v xvfb-run >/dev/null || { echo "xvfb-run missing after install"; exit 1; }

          # Whether this runner has the thing #213 is about. 24.04 ships
          # kernel.apparmor_restrict_unprivileged_userns=1, which is what an AppImage cannot satisfy
          # -- but GitHub's hosted images are not guaranteed to match a desktop install
          # (actions/runner-images#10015 proposes disabling AppArmor on them). Without this the
          # three `ok` runs on #213 cannot be told apart from "the restriction was never there",
          # which is a pass produced by the absence of the condition under test.
          # `|| true` because -e is on and a missing sysctl is a real answer, not a step failure.
          USERNS_RESTRICT=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo "not present")
          export TUFF_LAUNCH_USERNS_RESTRICT="$USERNS_RESTRICT"
          echo "kernel.apparmor_restrict_unprivileged_userns=$USERNS_RESTRICT"

          APPIMAGE=$(find apps/core-app/dist -name "*.AppImage" -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No .AppImage to launch. The verification step above should already have failed."
            exit 1
          fi
          chmod +x "$APPIMAGE"
          echo "Launching $APPIMAGE"

          # --appimage-extract-and-run avoids needing FUSE, which the runner does not have. It
          # changes how the file is mounted, not how the app sandboxes, so the thing #213 is about
          # is still exercised.
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout --signal=TERM 45s xvfb-run -a --server-args="-screen 0 1280x1024x24" "$APPIMAGE" --appimage-extract-and-run --disable-gpu > /tmp/launch.log 2>&1
          CODE=$?
          set -e

          # 124 is timeout's own code for "still running when I killed it", which is the success
          # shape here: a launcher that is alive after 45s started. Any other code means it exited.
          if [ "$CODE" -eq 124 ]; then STATE=alive; else STATE=dead; fi
          echo "exit=$CODE state=$STATE"
          node scripts/classify-app-launch.mjs /tmp/launch.log "$CODE" "$STATE"

      - name: Upload Linux launch log
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: linux-launch-log-${{ github.run_id }}
          path: /tmp/launch.log
          if-no-files-found: ignore

      # The Linux half of this landed as #1736 and the reasoning is identical here: the verification
      # step above counts artifacts, and a file that exists and a file that runs are different
      # claims. macOS had one thing Linux did not -- a signing check -- which verifies the bundle is
      # signed correctly and says nothing about whether it starts.
      #
      # The binary is launched directly out of Contents/MacOS rather than through `open`, because
      # `open` returns as soon as LaunchServices accepts the request and would report success for a
      # bundle that died a second later. A locally built bundle carries no quarantine attribute, so
      # this is not sidestepping Gatekeeper -- there is nothing to sidestep.
      # The third platform. Linux landed as #1736, macOS as #1737, and Windows was the one left
      # counting .exe files -- which made the coverage asymmetric, and asymmetric verification reads
      # as uniform to anyone who does not go and check.
      #
      # win-unpacked rather than the NSIS installer: it is the same binary the installer places, and
      # launching it directly skips a silent-install round trip that could fail for reasons having
      # nothing to do with whether the app runs. The pre-build "Clean Windows Build Artifacts" step
      # removes win-unpacked from a previous run, so what is there now came from this build.
      - name: "Smoke: launch the packaged Windows app"
        if: matrix.os == 'windows-2022'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path "apps/core-app/dist/win-unpacked" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "__uninstaller-*" } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "No executable under win-unpacked. The verification step above should already have failed."
            Get-ChildItem -Path "apps/core-app/dist" -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 20 | Format-Table Name
            exit 1
          }
          Write-Host "Launching $($exe.FullName)"

          $out = "$env:RUNNER_TEMP\launch.out"
          $err = "$env:RUNNER_TEMP\launch.err"
          $proc = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 45

          if ($proc.HasExited) {
            $state = "dead"
            $code = $proc.ExitCode
          } else {
            $state = "alive"
            $code = 0
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "exit=$code state=$state"

          # One file for the classifier; a GUI process on Windows splits little between the two and
          # the interesting line can land on either.
          $log = "$env:RUNNER_TEMP\launch.log"
          Get-Content $out, $err -ErrorAction SilentlyContinue | Set-Content $log
          if (-not (Test-Path $log)) { New-Item -ItemType File -Path $log | Out-Null }
          node scripts/classify-app-launch.mjs $log $code $state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows launch log
        if: always() && matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v7
        with:
          name: windows-launch-log-${{ github.run_id }}
          path: ${{ runner.temp }}/launch.log
          if-no-files-found: ignore

      - name: "Smoke: launch the packaged macOS app"
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find apps/core-app/dist -type d -name "*.app" -prune -print | head -1)
          if [ -z "$APP" ]; then
            echo "No .app bundle to launch. The verification step above should already have failed."
            exit 1
          fi
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          if [ ! -x "$BIN" ]; then
            echo "Expected an executable at $BIN"
            ls -la "$APP/Contents/MacOS" || true
            exit 1
          fi
          echo "Launching $BIN"

          set +e
          # No coreutils `timeout` on the macOS runner. A background process plus a poll does the
          # same job and, unlike `timeout`, distinguishes "still running" from "exited with 124".
          "$BIN" > /tmp/launch.log 2>&1 &
          PID=$!
          sleep 45
          if kill -0 "$PID" 2>/dev/null; then
            STATE=alive
            CODE=0
            kill "$PID" 2>/dev/null || true
          else
            wait "$PID"
            CODE=$?
            STATE=dead
          fi
          set -e
          echo "exit=$CODE state=$STATE"
          node scripts/classify-app-launch.mjs /tmp/launch.log "$CODE" "$STATE"

      - name: Upload macOS launch log
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: macos-launch-log-${{ github.run_id }}
          path: /tmp/launch.log
          if-no-files-found: ignore

      - name: Verify macOS Release Signing
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          app_bundles=()
          while IFS= read -r app_bundle; do
            app_bundles+=("${app_bundle}")
          done < <(find apps/core-app/dist -type d -name "*.app" -prune -print | sort)
          if [ "${#app_bundles[@]}" -ne 2 ]; then
            echo "Expected exactly two macOS app bundles, found ${#app_bundles[@]}."
            printf '  %s\n' "${app_bundles[@]}"
            exit 1
          fi

          app_bundle_args=()
          for app_bundle in "${app_bundles[@]}"; do
            app_bundle_args+=(--app-bundle "${app_bundle}")
          done

          node apps/core-app/scripts/verify-macos-release-signing.mjs \
            --mode "${TUFF_MAC_NATIVE_SIGNING_MODE:-developer-id}" \
            "${app_bundle_args[@]}" \
            --output apps/core-app/dist/release-signing-evidence.json

      - name: Cleanup macOS Notarization Credential File
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f "${APPLE_API_KEY}"
          fi

      - name: Verify Build Artifacts
        shell: bash
        run: |
          echo "Verifying build artifacts for $RUNNER_OS..."
          if [ -d "apps/core-app/dist" ]; then
            echo "Build artifacts found:"
            find apps/core-app/dist -type f -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.snap" -o -name "*.deb" | head -10
            echo "Total files in dist:"
            find apps/core-app/dist -type f | wc -l
          else
            echo "ERROR: No dist directory found!"
            exit 1
          fi

      # Was 109 lines of inline PowerShell that referenced no GitHub context -- pure filesystem
      # assertions that could only ever be exercised by pushing a tag at a Windows runner. The
      # logic now lives in a script with a `--self-test`, so a regression in it fails in CI
      # rather than during a release.
      - name: Assert Windows Installer Exists
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/check-windows-installer-artifacts.mjs

      - name: Bind provenance to the verified build source
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.release-quality.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${EXPECTED_SHA}" ] || [ "${GITHUB_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "OIDC source identity must match the quality-verified build commit."
            exit 1
          fi

      - name: Attest release package provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            apps/core-app/dist/*-setup.exe
            apps/core-app/dist/*.dmg
            apps/core-app/dist/*.AppImage
            apps/core-app/dist/*.deb
            apps/core-app/dist/*.snap
            apps/core-app/dist/*.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ steps.release-type.outputs.type }}
          path: |
            apps/core-app/dist/**/*-setup.exe
            apps/core-app/dist/**/*.dmg
            apps/core-app/dist/**/*.AppImage
            apps/core-app/dist/**/*.deb
            apps/core-app/dist/**/*.snap
            apps/core-app/dist/**/*.zip
            apps/core-app/dist/**/latest*.yml
            apps/core-app/dist/**/builder-debug.yml
            apps/core-app/dist/release-signing-evidence.json
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup Artifacts for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $distPath = "apps/core-app/dist"
          if (-not (Test-Path $distPath)) {
            Write-Host "Dist path not found: $distPath"
            exit 0
          }

          Write-Host "Cleaning Windows artifacts (keeping .exe files only)..."

          # Remove all non-.exe files
          Get-ChildItem -Path $distPath -Recurse -File -Force |
            Where-Object { $_.Extension -ne ".exe" } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # Remove empty directories (bottom-up)
          Get-ChildItem -Path $distPath -Recurse -Directory -Force |
            Sort-Object FullName -Descending |
            ForEach-Object {
              if (-not (Get-ChildItem -Path $_.FullName -Force -ErrorAction SilentlyContinue)) {
                Remove-Item -Path $_.FullName -Force -ErrorAction SilentlyContinue
              }
            }

      - name: Cleanup Artifacts for MacOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # Runs after Upload Artifacts; this only reclaims runner disk.
          #
          # `! -path "*.app/*"` is what makes the comment above true. A .app is a directory whose
          # contents are files -- Contents/MacOS/tuff, Info.plist, the frameworks -- so without it
          # this deletes the bundle's insides and leaves the skeleton. Harmless while the upload
          # happens first; anyone who reorders these, or adds a second upload after this step, would
          # otherwise ship an empty shell that still has the .app suffix and still counts (#1612).
          find apps/core-app/dist -type f ! -path "*.app/*" ! -name "*.dmg" ! -name "*.zip" -delete 2>/dev/null || true
          find apps/core-app/dist -type d -name "mac-*" -prune -o -type d ! -name "*.app" -empty -delete 2>/dev/null || true

  create-release:
    name: Create Release
    needs:
      - release-quality
      - build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      always()
      && needs.release-quality.result == 'success'
      && (
        needs.build-and-release.result == 'success'
        || (
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.sync_tag != ''
          && github.event.inputs.recover_run_id != ''
        )
      )
    permissions:
      actions: read
      contents: write
      attestations: read

    steps:
      - name: Check Build Results
        run: |
          echo "Build results:"
          echo "Windows: ${{ needs.build-and-release.result == 'success' }}"
          echo "macOS: ${{ needs.build-and-release.result == 'success' }}"
          echo "Linux: ${{ needs.build-and-release.result == 'success' }}"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-quality.outputs.sha }}

      - name: Validate recovery provenance
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.recover_run_id != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVER_RUN_ID: ${{ github.event.inputs.recover_run_id }}
          SYNC_TAG: ${{ github.event.inputs.sync_tag }}
        run: |
          set -euo pipefail
          if ! [[ "${RECOVER_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "recover_run_id must be a numeric GitHub Actions run ID."
            exit 1
          fi
          if ! [[ "${SYNC_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "sync_tag is required when recover_run_id is set."
            exit 1
          fi

          expected_sha=$(git rev-parse "${SYNC_TAG}^{commit}")
          checked_out_sha=$(git rev-parse HEAD)
          if [ "${checked_out_sha}" != "${expected_sha}" ]; then
            echo "Recovery checkout does not match sync_tag."
            exit 1
          fi

          api_base="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_base}/actions/runs/${RECOVER_RUN_ID}" \
            -o /tmp/recovery-run.json

          jq -e \
            --arg tag "${SYNC_TAG}" \
            --arg sha "${expected_sha}" \
            '.event == "push"
              and .head_branch == $tag
              and .head_sha == $sha
              and .name == "Build and Release"
              and .path == ".github/workflows/build-and-release.yml"' \
            /tmp/recovery-run.json >/dev/null || {
              echo "Recovery run provenance does not match sync_tag."
              exit 1
            }

          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_base}/actions/runs/${RECOVER_RUN_ID}/artifacts?per_page=100" \
            -o /tmp/recovery-artifacts.json

          tag_lower=$(echo "${SYNC_TAG}" | tr '[:upper:]' '[:lower:]')
          if [[ "${tag_lower}" == *"beta"* ]]; then
            channel=beta
          elif [[ "${tag_lower}" == *"snapshot"* ]]; then
            channel=snapshot
          else
            channel=release
          fi

          for artifact_name in \
            "windows-2022-${channel}" \
            "macos-latest-${channel}" \
            "ubuntu-latest-${channel}"; do
            jq -e --arg name "${artifact_name}" \
              '.artifacts[] | select(.name == $name and .expired == false)' \
              /tmp/recovery-artifacts.json >/dev/null || {
                echo "Required recovery artifact is missing or expired: ${artifact_name}"
                exit 1
              }
          done

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install release tooling dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          run-id: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.recover_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix macOS App Permissions After Download
        shell: bash
        run: |
          # GitHub Actions upload-artifact automatically compresses to zip
          # We need to extract and fix permissions after download
          echo "Fixing macOS app permissions after artifact extraction..."
          echo "Searching for .app directories in artifacts..."

          # Find all .app directories (they may be in subdirectories after extraction)
          # Try multiple path patterns
          APP_FOUND=false
          while IFS= read -r app_dir; do
            if [ -d "$app_dir" ]; then
              APP_FOUND=true
              echo "Found .app directory: $app_dir"
              echo "Fixing permissions for: $app_dir"

              # Fix main executable
              if [ -f "$app_dir/Contents/MacOS/tuff" ]; then
                chmod +x "$app_dir/Contents/MacOS/tuff"
                echo "  ✓ Fixed main executable permissions"
              fi

              # Fix all Framework executables
              if [ -d "$app_dir/Contents/Frameworks" ]; then
                find "$app_dir/Contents/Frameworks" -type f ! -name "*.dylib" ! -name "*.plist" -exec chmod +x {} \;
                echo "  ✓ Fixed Framework executable permissions"
              fi

              # Remove quarantine attribute (if on macOS)
              if [ "$(uname)" = "Darwin" ]; then
                xattr -dr com.apple.quarantine "$app_dir" 2>/dev/null || true
                echo "  ✓ Removed quarantine attribute"
              fi
            fi
          done < <(find artifacts -type d -name "*.app" 2>/dev/null | sort)

          if [ "$APP_FOUND" = "false" ]; then
            echo "⚠️  No .app directories found in artifacts/"
            echo "Listing artifacts directory structure:"
            find artifacts -type d -maxdepth 3 | head -20
          else
            echo "✓ macOS app permissions fixed"
          fi

      - name: Determine Release Type and Tag
        id: release-info
        run: |
          {
            if [ -n "$RECOVER_RUN_ID" ]; then
              REF_NAME_LOWER=$(echo "$SYNC_TAG" | tr '[:upper:]' '[:lower:]')
              if [[ "$REF_NAME_LOWER" == *"beta"* ]]; then
                echo "type=beta"
              elif [[ "$REF_NAME_LOWER" == *"snapshot"* ]]; then
                echo "type=snapshot"
              else
                echo "type=release"
              fi
              echo "tag=$SYNC_TAG"
              echo "name=Release $SYNC_TAG"
              echo "target_ref=$SYNC_TAG"
              if [[ "$REF_NAME_LOWER" == *"beta"* || "$REF_NAME_LOWER" == *"snapshot"* ]]; then
                echo "prerelease=true"
              else
                echo "prerelease=false"
              fi
            elif [ "$EVENT_NAME" = "push" ]; then
              # 标签触发：使用标签信息创建 release
              REF_NAME_LOWER=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]')
              echo "type=release"
              echo "tag=$REF_NAME"
              echo "name=Release $REF_NAME"
              echo "target_ref=$TARGET_SHA"
              if [[ "$REF_NAME_LOWER" == *"beta"* || "$REF_NAME_LOWER" == *"snapshot"* ]]; then
                echo "prerelease=true"
              else
                echo "prerelease=false"
              fi
            else
              # 手动触发：创建 draft release，使用时间戳作为临时标签
              # 标签会被 release action 自动创建，但因为是 draft，不会正式发布
              #
              # The tag has to be semver-shaped. The next step feeds it to
              # resolve-update-rollback-version.mjs, which calls inferManifestChannel and throws on
              # anything that is not MAJOR.MINOR.PATCH[-label.x] -- manual-build-<timestamp> is not,
              # so every manual run died after the full three-platform build (#727).
              #
              # The label picks the channel, and only these work: snapshot/beta/alpha map to BETA,
              # master maps to RELEASE; manual, release and rc all return null. The base version is
              # used rather than the package version because inferManifestChannel reads the *first*
              # prerelease identifier -- appending to 2.4.14-beta.2 keeps resolving to BETA even for
              # a release-type build.
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
              case "$RELEASE_TYPE" in
                snapshot) CHANNEL_LABEL=snapshot ;;
                beta) CHANNEL_LABEL=beta ;;
                *) CHANNEL_LABEL=master ;;
              esac
              echo "type=$RELEASE_TYPE"
              echo "tag=v${BASE_VERSION}-${CHANNEL_LABEL}.${TIMESTAMP}"
              echo "name=Manual Build ($RELEASE_TYPE) - $TIMESTAMP"
              echo "target_ref=$TARGET_SHA"
              if [ "$RELEASE_TYPE" = "snapshot" ] || [ "$RELEASE_TYPE" = "beta" ]; then
                echo "prerelease=true"
              else
                echo "prerelease=false"
              fi
            fi
          } >> "$GITHUB_OUTPUT"

        env:
          EVENT_NAME: ${{ github.event_name }}
          RECOVER_RUN_ID: ${{ github.event.inputs.recover_run_id }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          SYNC_TAG: ${{ github.event.inputs.sync_tag }}
          TARGET_SHA: ${{ github.sha }}
      - name: Resolve same-channel rollback version
        id: rollback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-info.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r '.[] | select(.draft == false) | .tag_name' > /tmp/published-release-tags.txt
          rollback=$(node scripts/resolve-update-rollback-version.mjs \
            --tag "${RELEASE_TAG}" \
            --tags-file /tmp/published-release-tags.txt)
          {
            echo "from_version=$(jq -er '.rollbackFromVersion' <<<"${rollback}")"
            echo "channel=$(jq -er '.channel' <<<"${rollback}")"
          } >> "$GITHUB_OUTPUT"

      - name: List Available Artifacts
        run: |
          echo "Available artifacts:"
          find artifacts -type f \( -name "*-setup.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.snap" -o -name "*.deb" -o -name "*.zip" \) ! -path "*/win-unpacked/*" ! -name "__uninstaller-*.exe" | sort
          find artifacts -type d -name "*.app" -path "*/mac-*/*" | sort
          echo "Total files:"
          find artifacts -type f | wc -l
          echo "Total .app directories:"
          find artifacts -type d -name "*.app" -path "*/mac-*/*" | wc -l
          echo "Total .zip files:"
          find artifacts -type f -name "*.zip" | wc -l

      - name: Validate Release Signing Trust Roots
        run: node scripts/check-release-signing-trust-roots.mjs

      - name: Collect Release Assets
        id: release-files
        env:
          TAG: ${{ steps.release-info.outputs.tag }}
          RELEASE_TYPE: ${{ steps.release-info.outputs.type }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          # Passed as environment variables rather than interpolated into the script below.
          # GitHub substitutes ${{ }} into the run: text before bash ever parses it, so a
          # workflow_dispatch input containing $(…) executed as a command — in this step,
          # which decodes RELEASE_SIGNING_PRIVATE_KEY to disk a few lines earlier (#539).
          CHANNEL: ${{ steps.rollback.outputs.channel }}
          ROLLBACK_FROM_VERSION: ${{ steps.rollback.outputs.from_version }}
          ROLLBACK_COMPATIBLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_compatible || 'false' }}
          ROLLBACK_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_evidence || '' }}
          ROLLBACK_EVIDENCE_SIGNATURE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_evidence_signature || '' }}
        run: |
          set -euo pipefail

          # Collect files (exclude raw win-unpacked executables to avoid broken standalone EXE release)
          mapfile -t FILES < <(
            find artifacts -type f \
              \( -name "*-setup.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.snap" -o -name "*.deb" -o -name "*.zip" -o -name "latest*.yml" -o -name "builder-debug.yml" \) \
              ! -path "*/win-unpacked/*" \
              ! -name "__uninstaller-*.exe" \
              | sort
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release files found in artifacts/"
            exit 1
          fi

          WINDOWS_INSTALLER_COUNT=$(printf "%s\n" "${FILES[@]}" | grep -Ec -- '-setup\.exe$' || true)
          if [ "${WINDOWS_INSTALLER_COUNT}" -eq 0 ]; then
            echo "No Windows installer (*-setup.exe) found. Refusing to publish raw executable."
            echo "Detected exe files:"
            find artifacts -type f -name "*.exe" | sort || true
            exit 1
          fi

          mkdir -p release-assets
          declare -a OUTPUT_PATHS=()

          # Process files (including zip files)
          for file in "${FILES[@]}"; do
            relative=${file#artifacts/}
            platform=${relative%%/*}
            if [[ "$platform" == "$relative" ]]; then
              platform="common"
            fi

            base=$(basename "$file")
            target="release-assets/${platform}-${base}"
            counter=1
            while [ -e "$target" ]; do
              counter=$((counter + 1))
              target="release-assets/${platform}-${counter}-${base}"
            done

            cp "$file" "$target"
            OUTPUT_PATHS+=("$target")
          done

          if [ -z "${RELEASE_SIGNING_PRIVATE_KEY}" ]; then
            echo "RELEASE_SIGNING_PRIVATE_KEY is required for official release assets."
            exit 1
          fi

          signing_key_path="${RUNNER_TEMP}/tuff-release-signing-private.pem"
          trap 'rm -f "${signing_key_path}"' EXIT
          umask 077
          if [[ "${RELEASE_SIGNING_PRIVATE_KEY}" == -----BEGIN* ]]; then
            printf '%s' "${RELEASE_SIGNING_PRIVATE_KEY}" > "${signing_key_path}"
          else
            printf '%s' "${RELEASE_SIGNING_PRIVATE_KEY}" | base64 --decode > "${signing_key_path}"
          fi

          case "${ROLLBACK_COMPATIBLE}" in
            true)
              if [ -z "${ROLLBACK_EVIDENCE}" ] || [ -z "${ROLLBACK_EVIDENCE_SIGNATURE}" ]; then
                echo "rollbackCompatible=true requires rollback_evidence and rollback_evidence_signature."
                exit 1
              fi
              if [ ! -f "${ROLLBACK_EVIDENCE}" ] || [ ! -f "${ROLLBACK_EVIDENCE_SIGNATURE}" ]; then
                echo "Configured rollback evidence or detached signature file is missing."
                exit 1
              fi
              rollback_evidence_args=(
                --rollback-evidence "${ROLLBACK_EVIDENCE}"
                --rollback-evidence-signature "${ROLLBACK_EVIDENCE_SIGNATURE}"
              )
              ;;
            false) rollback_evidence_args=() ;;
            *)
              echo "rollback_compatible must be true or false."
              exit 1
              ;;
          esac

          node scripts/prepare-release-assets.mjs \
            --tag "${TAG}" \
            --channel "${CHANNEL}" \
            --rollback-from-version "${ROLLBACK_FROM_VERSION}" \
            --expected-rollback-from-version "${ROLLBACK_FROM_VERSION}" \
            --rollback-compatible "${ROLLBACK_COMPATIBLE}" \
            "${rollback_evidence_args[@]}" \
            --release-dir release-assets \
            --private-key "${signing_key_path}" \
            --public-key apps/core-app/resources/keys/release-signing-public.pem \
            --manifest release-assets/tuff-release-manifest.json

          node scripts/update-validate-release-manifest.mjs \
            --manifest release-assets/tuff-release-manifest.json \
            --expected-rollback-from-version "${ROLLBACK_FROM_VERSION}"

          mapfile -t SIGNATURE_PATHS < <(find release-assets -maxdepth 1 -type f -name "*.sig" | sort)
          if [ "${#SIGNATURE_PATHS[@]}" -eq 0 ]; then
            echo "No detached signature sidecars were generated."
            exit 1
          fi
          OUTPUT_PATHS+=("${SIGNATURE_PATHS[@]}")
          OUTPUT_PATHS+=("release-assets/tuff-release-manifest.json")
          OUTPUT_PATHS+=("release-assets/release-test-summary.json")
          OUTPUT_PATHS+=("release-assets/release-test-summary.md")
          OUTPUT_PATHS+=("generated-release-notes/tuff-release-notes.json")

          {
            echo "files<<EOF"
            for path in "${OUTPUT_PATHS[@]}"; do
              echo "$path"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify source-bound package provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.release-quality.outputs.sha }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' artifact; do
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-and-release.yml" \
              --source-digest "${EXPECTED_SHA}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners
            count=$((count + 1))
          done < <(find release-assets -maxdepth 1 -type f \
            \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.snap' -o -name '*.zip' \) -print0)
          if [ "${count}" -eq 0 ]; then
            echo "No release packages were verified against OIDC provenance."
            exit 1
          fi

      - name: Generate Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-release-notes.mjs \
            --tag "${{ steps.release-info.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target-ref "${{ steps.release-info.outputs.target_ref }}" \
            --output-dir "generated-release-notes"

      - name: Generate Release Test Summary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t mac_evidence_files < <(find artifacts -type f -name "release-signing-evidence.json" | sort)
          if [ "${#mac_evidence_files[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS signing evidence file, found ${#mac_evidence_files[@]}."
            exit 1
          fi

          set +e
          node scripts/generate-release-test-summary.mjs \
            --release-dir release-assets \
            --manifest release-assets/tuff-release-manifest.json \
            --public-key apps/core-app/resources/keys/release-signing-public.pem \
            --mac-evidence "${mac_evidence_files[0]}" \
            --output-dir release-assets
          summary_status=$?
          set -e

          if [ -f release-assets/release-test-summary.md ]; then
            cat release-assets/release-test-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${summary_status}"

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: ${{ steps.release-info.outputs.name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.recover_run_id == '' }}
          prerelease: ${{ steps.release-info.outputs.prerelease == 'true' }}
          files: ${{ steps.release-files.outputs.files }}
          fail_on_unmatched_files: true
          body_path: generated-release-notes/release-notes.github.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-nexus-release:
    name: Sync Nexus Release
    needs:
      - release-quality
      - create-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    if: >
      always()
      && needs.release-quality.result == 'success'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.create-release.result == 'success')
        || (
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.sync_tag != ''
          && (
            github.event.inputs.recover_run_id == ''
            || needs.create-release.result == 'success'
          )
        )
      )
    env:
      NEXUS_BASE_URL: ${{ vars.NEXUS_SYNC_BASE_URL || 'https://tuff.tagzxia.com' }}
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      # The client ID is an identifier, so a variable is a reasonable place for it.
      # The client secret is not: repository and organization variables are plaintext
      # configuration, readable in the settings UI and the API, and never masked in Actions
      # logs — so a `curl -v` printing the CF-Access-Client-Secret header would put standing
      # access to the Nexus admin API into a public release log (#541). Secrets only.
      NEXUS_CF_ACCESS_CLIENT_ID: ${{ vars.ADMIN_CF_ACCESS_CLIENT_ID || secrets.ADMIN_CF_ACCESS_CLIENT_ID }}
      NEXUS_CF_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_CF_ACCESS_CLIENT_SECRET }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_tag || github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate Nexus sync credentials
        run: |
          if [ -z "${NEXUS_API_KEY}" ]; then
            echo "NEXUS_API_KEY is required for release sync."
            exit 1
          fi

          # Cloudflare Access is optional — both empty means it is not in front of Nexus.
          # Half-configured is not, and it is the state a setup that kept the client secret
          # in a *variable* lands in, because this job now reads it from secrets only (#541).
          # Saying so here beats an opaque 403 several steps later.
          if [ -n "${NEXUS_CF_ACCESS_CLIENT_ID}" ] && [ -z "${NEXUS_CF_ACCESS_CLIENT_SECRET}" ]; then
            echo "NEXUS_CF_ACCESS_CLIENT_ID is set but NEXUS_CF_ACCESS_CLIENT_SECRET is empty."
            echo "The client secret is read from secrets.ADMIN_CF_ACCESS_CLIENT_SECRET only."
            echo "If it is currently stored as a repository or organization *variable*, move it"
            echo "to a secret — variables are plaintext and are never masked in workflow logs."
            exit 1
          fi

          if [ -z "${NEXUS_CF_ACCESS_CLIENT_ID}" ] && [ -n "${NEXUS_CF_ACCESS_CLIENT_SECRET}" ]; then
            echo "NEXUS_CF_ACCESS_CLIENT_SECRET is set but NEXUS_CF_ACCESS_CLIENT_ID is empty."
            exit 1
          fi

      - name: Validate sync tag
        run: |
          if [ -z "${TAG}" ]; then
            echo "TAG is required for release sync."
            exit 1
          fi

          if ! echo "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$'; then
            echo "Invalid TAG format: ${TAG}. Expected format like v2.4.7"
            exit 1
          fi

      - name: Resolve release metadata
        id: meta
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-quality.outputs.sha }}

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install release tooling dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve same-channel rollback version
        id: sync-rollback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r '.[] | select(.draft == false) | .tag_name' > /tmp/published-release-tags.txt
          rollback=$(node scripts/resolve-update-rollback-version.mjs \
            --tag "${TAG}" \
            --tags-file /tmp/published-release-tags.txt)
          {
            echo "from_version=$(jq -er '.rollbackFromVersion' <<<"${rollback}")"
            echo "channel=$(jq -er '.channel' <<<"${rollback}")"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch GitHub release metadata
        run: |
          curl -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            -o /tmp/github-release.json

          jq -e '.id and (.assets | type == "array")' /tmp/github-release.json >/dev/null

      - name: Download and validate release manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_url=$(jq -er 'first(.assets[] | select(.name=="tuff-release-manifest.json")).browser_download_url' /tmp/github-release.json)
          curl -sSL -f \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${manifest_url}" \
            -o /tmp/tuff-release-manifest.json
          node scripts/update-validate-release-manifest.mjs \
            --manifest /tmp/tuff-release-manifest.json \
            --expected-rollback-from-version "${{ steps.sync-rollback.outputs.from_version }}"
          jq -e --arg tag "${TAG}" '.release.tag == $tag' /tmp/tuff-release-manifest.json >/dev/null

      - name: Generate Release Notes
        run: |
          node scripts/generate-release-notes.mjs \
            --tag "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target-ref "${GITHUB_SHA}" \
            --output-dir "/tmp/generated-release-notes"

      - name: Resolve release notes payload
        run: |
          set -euo pipefail

          VERSION="${{ steps.meta.outputs.version }}"
          generated_zh="/tmp/generated-release-notes/update_${VERSION}.zh.md"
          generated_en="/tmp/generated-release-notes/update_${VERSION}.en.md"

          if [ ! -s "${generated_zh}" ] || [ ! -s "${generated_en}" ]; then
            echo "Generated bilingual release notes are required."
            exit 1
          fi

          notes_zh=$(cat "${generated_zh}")
          notes_en=$(cat "${generated_en}")

          render_markdown() {
            local content="$1"

            if [ -z "${content//[[:space:]]/}" ]; then
              echo ""
              return
            fi

            local payload
            payload=$(jq -nc \
              --arg text "${content}" \
              --arg context "${GITHUB_REPOSITORY}" \
              '{text: $text, mode: "gfm", context: $context}')

            curl -sS \
              -X POST "https://api.github.com/markdown" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "${payload}"
          }

          notes_html_zh=$(render_markdown "${notes_zh}")
          if [ "${notes_en}" = "${notes_zh}" ]; then
            notes_html_en="${notes_html_zh}"
          else
            notes_html_en=$(render_markdown "${notes_en}")
          fi

          notes_json=$(jq -nc --arg zh "${notes_zh}" --arg en "${notes_en}" '{zh: $zh, en: $en}')
          notes_html_json=$(jq -nc --arg zh "${notes_html_zh}" --arg en "${notes_html_en}" '{zh: $zh, en: $en}')

          printf '%s' "${notes_json}" > /tmp/nexus-release-notes.json
          printf '%s' "${notes_html_json}" > /tmp/nexus-release-notes-html.json

      - name: Prepare Nexus sync helpers
        run: |
          cat >/tmp/nexus-sync-helpers.sh <<'EOF'
          set -euo pipefail

          create_nexus_headers() {
            local -n output_headers="$1"
            output_headers=(
              -H "Authorization: Bearer ${NEXUS_API_KEY}"
              -H "Accept: application/json"
              -H "User-Agent: tuff-release-sync/1.0"
            )

            if [ -n "${NEXUS_CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${NEXUS_CF_ACCESS_CLIENT_SECRET:-}" ]; then
              output_headers+=(
                -H "CF-Access-Client-Id: ${NEXUS_CF_ACCESS_CLIENT_ID}"
                -H "CF-Access-Client-Secret: ${NEXUS_CF_ACCESS_CLIENT_SECRET}"
              )
            fi
          }

          response_is_json() {
            local file_path="$1"
            jq -e . "${file_path}" >/dev/null 2>&1
          }

          response_has_status_message() {
            local file_path="$1"
            local expected="$2"
            jq -e --arg expected "${expected}" '.statusMessage? == $expected' "${file_path}" >/dev/null 2>&1
          }

          assert_nexus_response_ok() {
            local file_path="$1"
            local http_code="$2"
            local shape_jq="${3:-.}"

            if ! response_is_json "${file_path}"; then
              cat "${file_path}"
              return 1
            fi

            if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              cat "${file_path}"
              return 1
            fi

            if ! jq -e "${shape_jq}" "${file_path}" >/dev/null 2>&1; then
              cat "${file_path}"
              return 1
            fi
          }
          EOF

      - name: Upsert Nexus release metadata
        run: |
          source /tmp/nexus-sync-helpers.sh
          notes_json=$(cat /tmp/nexus-release-notes.json)
          notes_html_json=$(cat /tmp/nexus-release-notes-html.json)
          nexus_headers=()
          create_nexus_headers nexus_headers
          rollback_from_version=$(jq -er '.release.rollbackFromVersion' /tmp/tuff-release-manifest.json)
          rollback_compatible=$(jq -r '.release.rollbackCompatible' /tmp/tuff-release-manifest.json)


          create_payload=$(jq -n \
            --arg tag "${TAG}" \
            --arg name "Release ${TAG}" \
            --arg channel "${{ steps.sync-rollback.outputs.channel }}" \
            --arg version "${{ steps.meta.outputs.version }}" \
            --arg rollbackFromVersion "${rollback_from_version}" \
            --argjson rollbackCompatible "${rollback_compatible}" \
            --argjson notes "${notes_json}" \
            --argjson notesHtml "${notes_html_json}" \
            '{
              tag: $tag,
              name: $name,
              channel: $channel,
              version: $version,
              rollbackFromVersion: $rollbackFromVersion,
              rollbackCompatible: $rollbackCompatible,
              notes: $notes,
              notesHtml: $notesHtml,
              status: "draft"
            }')

          update_payload=$(jq -n \
            --arg name "Release ${TAG}" \
            --arg rollbackFromVersion "${rollback_from_version}" \
            --argjson rollbackCompatible "${rollback_compatible}" \
            --argjson notes "${notes_json}" \
            --argjson notesHtml "${notes_html_json}" \
            '{
              name: $name,
              rollbackFromVersion: $rollbackFromVersion,
              rollbackCompatible: $rollbackCompatible,
              notes: $notes,
              notesHtml: $notesHtml
            }')

          http_code=$(curl -sS -o /tmp/nexus-release-create.json -w "%{http_code}" \
            -X POST "${NEXUS_BASE_URL}/api/releases" \
            "${nexus_headers[@]}" \
            -H "Content-Type: application/json" \
            -d "${create_payload}")

          if [ "${http_code}" = "400" ] && response_has_status_message /tmp/nexus-release-create.json 'Release tag already exists.'; then
            patch_code=$(curl -sS -o /tmp/nexus-release-update.json -w "%{http_code}" \
              -X PATCH "${NEXUS_BASE_URL}/api/releases/${TAG}" \
              "${nexus_headers[@]}" \
              -H "Content-Type: application/json" \
              -d "${update_payload}")
            assert_nexus_response_ok /tmp/nexus-release-update.json "${patch_code}" '.release.id? and .release.tag?'
          elif [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            assert_nexus_response_ok /tmp/nexus-release-create.json "${http_code}"
            exit 1
          else
            assert_nexus_response_ok /tmp/nexus-release-create.json "${http_code}" '.release.id? and .release.tag?'
          fi

      - name: Link GitHub assets to Nexus release
        run: |
          set -euo pipefail
          source /tmp/nexus-sync-helpers.sh
          nexus_headers=()
          create_nexus_headers nexus_headers


          while IFS= read -r encoded; do
            manifest_item=$(printf '%s' "${encoded}" | base64 --decode)
            name=$(printf '%s' "${manifest_item}" | jq -r '.name')
            platform=$(printf '%s' "${manifest_item}" | jq -r '.platform')
            arch=$(printf '%s' "${manifest_item}" | jq -r '.arch')
            sha256=$(printf '%s' "${manifest_item}" | jq -r '.sha256')
            signature_name=$(printf '%s' "${manifest_item}" | jq -r '.signature')

            asset_item=$(jq -ce --arg name "${name}" 'first(.assets[] | select(.name==$name))' /tmp/github-release.json)
            signature_item=$(jq -ce --arg name "${signature_name}" 'first(.assets[] | select(.name==$name))' /tmp/github-release.json)
            url=$(printf '%s' "${asset_item}" | jq -r '.browser_download_url')
            size=$(printf '%s' "${asset_item}" | jq -r '.size')
            content_type=$(printf '%s' "${asset_item}" | jq -r '.content_type // "application/octet-stream"')
            signature_url=$(printf '%s' "${signature_item}" | jq -r '.browser_download_url')

            payload=$(jq -n \
              --arg platform "${platform}" \
              --arg arch "${arch}" \
              --arg filename "${name}" \
              --arg downloadUrl "${url}" \
              --arg signatureUrl "${signature_url}" \
              --argjson size "${size}" \
              --arg sha256 "${sha256}" \
              --arg contentType "${content_type}" \
              '{
                platform: $platform,
                arch: $arch,
                filename: $filename,
                downloadUrl: $downloadUrl,
                signatureUrl: $signatureUrl,
                size: $size,
                sha256: $sha256,
                contentType: $contentType
              }')

            http_code=$(curl -sS -o /tmp/nexus-release-link.json -w "%{http_code}" \
              -X POST "${NEXUS_BASE_URL}/api/releases/${TAG}/link-github" \
              "${nexus_headers[@]}" \
              -H "Content-Type: application/json" \
              -d "${payload}")
            assert_nexus_response_ok /tmp/nexus-release-link.json "${http_code}" '.asset.id? and .asset.platform? and .asset.arch? and .asset.signatureUrl?'
          done < <(jq -r '.artifacts[] | select(.component=="core") | @base64' /tmp/tuff-release-manifest.json)

      - name: Publish Nexus release
        run: |
          source /tmp/nexus-sync-helpers.sh
          nexus_headers=()
          create_nexus_headers nexus_headers

          http_code=$(curl -sS -o /tmp/nexus-release-publish.json -w "%{http_code}" \
            -X POST "${NEXUS_BASE_URL}/api/releases/${TAG}/publish" \
            "${nexus_headers[@]}")
          assert_nexus_response_ok /tmp/nexus-release-publish.json "${http_code}" '.release.id? and .release.tag? and .message?'
